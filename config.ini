# MO3 - Marquee Console : runtime parameters
#
# The quiz forbids recompiling ("you should only modify the parameters"), so
# every value here can be changed between runs with no rebuild. The three rates
# can also be changed live from inside the console with set_speed, set_refresh
# and set_polling_rate.
#
# Edit the developer names and version date below before submitting.

[console]
console_width  = 100
# Tall enough for the full `help` listing (12 lines) to fit in the output zone
# at once. The header grows one row per name in `developers` below, so adding
# a fifth developer needs a row back here too.
console_height = 42
# Height of the bouncing-marquee box, borders included.
marquee_zone_height = 9

[marquee]
marquee_text     = Hello world in marquee!
# set_speed - how often the marquee advances one step.
marquee_speed_ms = 50
auto_start_marquee = false

[rates]
# set_refresh - how often a whole frame is composed and presented.
# Raise this (slower) to make screen tearing appear; 16 ms is about 60 FPS.
refresh_ms = 16
# set_polling_rate - how often the keyboard is polled.
# Raise this (slower) to make typing feel laggy.
polling_ms = 10

[about]
# Semicolon-separated, because names contain commas.
developers   = CAMPO, Enzo; GARCIA, Andrea; MORGAN, Jack; TENORIO, Jeroen
version_date = September 2026
# Build version - see CHANGELOG.md and versions/. Bump this when a new snapshot
# is taken so the running program identifies itself on the quiz video.
version      = 1.1.0
